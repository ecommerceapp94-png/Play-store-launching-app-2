    <g transform="translate(770 280)" filter="url(#softGlow)">
      <circle cx="0" cy="0" r="116" fill="#ffffff" opacity="0.08"/>
      <circle cx="0" cy="0" r="116" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
      <g stroke="url(#xGrad)" stroke-width="32" stroke-linecap="round">
        <line x1="-58" y1="-58" x2="58" y2="58"/>
        <line x1="58" y1="-58" x2="-58" y2="58"/>
      </g>
      <circle cx="0" cy="0" r="9" fill="#fff7d6"/>
    </g>
